name: CI

on:
  push:
    branches: ['main']
  pull_request:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: '1.96'
  CARGO_TERM_COLOR: always

jobs:
  extension:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  server:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: npm ci --prefix server/web
      # Builds server/web/dist, which the Rust binary embeds at compile time.
      - run: npm --prefix server/web test
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --manifest-path server/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path server/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path server/Cargo.toml --locked --all-targets
      - run: cargo build --manifest-path server/Cargo.toml --locked --release

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features --root "$RUNNER_TEMP/cargo-audit"
      - name: Audit Cargo.lock against RustSec
        run: '"$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --file server/Cargo.lock'
      - name: Audit shipped npm dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix server/web --omit=dev --audit-level=high

  docker:
    if: github.event_name != 'schedule'
    needs: [extension, server, audit]
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
